services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env.prod
    depends_on:
      - qdrant
      - valkey
    environment:
      QDRANT_URL: http://qdrant:6333
      VALKEY_URL: redis://valkey:6379
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --timeout-keep-alive 75

  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env.prod
    depends_on:
      - api
    environment:
      API_URL: http://api:8000/api/v1
    command: ["streamlit", "run", "frontend/app.py",
              "--server.port=8501",
              "--server.address=0.0.0.0",
              "--server.headless=true",
              "--server.fileWatcherType=none"]

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage

  valkey:
    image: valkey/valkey:7.2-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --save 60 1 --appendonly yes

volumes:
  qdrant_data:
    external: true
  valkey_data:
    external: true
